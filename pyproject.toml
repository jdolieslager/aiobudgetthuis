[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiobudgetthuis"
version = "0.1.1"
description = "Async Python client for the unofficial Budget Thuis (Budget Energie) API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesper Dolieslager" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]
keywords = ["budget-thuis", "budget-energie", "energy", "dynamic-prices", "asyncio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jdolieslager/aiobudgetthuis"
Source = "https://github.com/jdolieslager/aiobudgetthuis"
Issues = "https://github.com/jdolieslager/aiobudgetthuis/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "pytest-cov>=5",
  "ruff>=0.16.0",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiobudgetthuis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["aiobudgetthuis"]

[tool.ruff]
required-version = ">=0.16.0"
target-version = "py312"

[tool.ruff.lint]
select = [
  "A001", "ASYNC", "B", "BLE", "C4", "COM818", "D", "DTZ", "E", "F", "FLY",
  "FURB", "G", "I", "INP", "ISC", "ICN001", "LOG", "N", "PERF", "PGH", "PIE",
  "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "SLOT", "T20",
  "TC", "TID", "TRY", "UP", "W",
  "ERA001",
  "TD002", "TD003",
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "E501",   # line length handled by the formatter
  "PLR2004", # HTTP status codes read fine inline (matches HA core)
  "TRY003", # long messages outside the exception class (noisy)
  "TID252", # allow relative imports within the package
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false
known-first-party = ["aiobudgetthuis"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
enable_error_code = ["ignore-without-code", "redundant-self", "explicit-override"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
